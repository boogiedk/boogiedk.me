name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one to finish.
concurrency: deploy

env:
  IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/boogiedk.me

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Restart the container on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PRIVATE_KEY_PASSPHRASE }}
          script: |
            set -e
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f boogiedk.me || true
            docker run -d --name boogiedk.me --restart unless-stopped -p 127.0.0.1:3000:3000 ${{ env.IMAGE }}:${{ github.sha }}
